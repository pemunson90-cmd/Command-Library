name: Ordinary artwork focused host verification
on:
  push:
    branches: ['agent/artwork-host-20261030']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artwork-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure existing JDK and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' > /dev/null
      - name: Focused artwork and existing shell regression
        working-directory: android-app
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain :feature:shell:testDebugUnitTest --tests '*CardArtwork*' --tests '*PrintingSelectionControllerTest*' --tests '*SettingsControllerTest*' --tests '*ConsentReviewControllerTest*'
          bash gradlew --no-daemon --console=plain :app:testDebugUnitTest --tests '*CardArtwork*'
      - name: Require executed scoped XML with no failures or skips
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib, xml.etree.ElementTree as E
          reports = list(pathlib.Path('android-app/feature/shell/build/test-results').glob('**/TEST-*.xml')) + list(pathlib.Path('android-app/app/build/test-results').glob('**/TEST-*.xml'))
          expected = {'CardArtworkControllerTest', 'ConsentReviewControllerTest', 'PrintingSelectionControllerTest', 'SettingsControllerTest', 'AppCardArtworkAccessTest', 'CardArtworkAppIntegrationTest'}
          seen = set(); total = 0
          for path in reports:
              r = E.parse(path).getroot()
              name = r.get('name', '').split('.')[-1]
              if name not in expected: continue
              count = int(r.get('tests', 0)); assert count > 0, path
              assert all(int(r.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), path
              assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in r.iter('testcase')), path
              print(name, count, 'tests; 0 failures/errors/skips')
              seen.add(name); total += count
          assert seen == expected, ('Missing suites', expected - seen)
          print('Total scoped XML cases', total)
          PYCODE
      - name: Compile actual app and instrumentation consumers
        working-directory: android-app
        run: bash gradlew --no-daemon --console=plain :app:compileDebugAndroidTestKotlin :feature:shell:compileDebugAndroidTestKotlin :app:lintDebug :feature:shell:lintDebug
      - name: Retain exact host test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: artwork-host-${{ github.sha }}
          path: |
            android-app/feature/shell/build/test-results/**
            android-app/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
