name: M2 life domain exact JVM
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character source commit to test
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: m2-life-domain-${{ inputs.target_sha }}
  cancel-in-progress: false
jobs:
  life-jvm:
    if: github.repository == 'pemunson90-cmd/Command-Library'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate exact source identifier
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['TARGET_SHA'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify checkout and select JDK17
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD
          test -x "$JAVA_HOME_17_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Exact requested model and life tests
        working-directory: android-app
        run: bash gradlew --no-daemon --console=plain :core:model:test :feature:life:test
      - name: Verify executed reports
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          total = 0
          for module in ('core/model', 'feature/life'):
              reports = list(pathlib.Path('android-app', module, 'build/test-results/test').glob('TEST-*.xml'))
              assert reports, module
              roots = [ET.parse(p).getroot() for p in reports]
              counts = {key: sum(int(r.get(key, 0)) for r in roots) for key in ('tests', 'failures', 'errors', 'skipped')}
              assert counts['tests'] > 0 and all(counts[k] == 0 for k in ('failures', 'errors', 'skipped')), (module, counts)
              print(module, counts)
              total += counts['tests']
          print('Exact-source JVM total:', total)
          PY
      - name: Retain source-pinned evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m2-life-domain-${{ inputs.target_sha }}
          path: |
            android-app/core/model/build/test-results/test/**
            android-app/feature/life/build/test-results/test/**
            android-app/feature/life/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14
