name: Continuity integrity
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1; official tag commit verified 2026-10-11.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check_continuity.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
