name: Android K2 build and emulator
on:
  push:
    branches: ['main', 'agent/cc-*', 'agent/cx-*']
    paths: ['android-app/**', '.github/workflows/android-k2.yml']
  pull_request:
    branches: ['main']
    paths:
      - 'android-app/**'
      - '.github/workflows/android-k2.yml'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch:
    inputs:
      compatibility_matrix:
        description: Also run Android 6 and alternate 16 KiB compatibility lanes
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: android-k2-${{ github.ref }}
  cancel-in-progress: true
env:
  SDK_PLATFORM: 'platforms;android-37.0'
  SDK_BUILD_TOOLS: 'build-tools;36.0.0'
jobs:
  jvm-and-assemble:
    # Recovery work is verified locally; retain the complete PR/main/manual gates.
    if: github.repository == 'pemunson90-cmd/Command-Library' && !(github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/agent/cx-native-') || startsWith(github.ref, 'refs/heads/agent/cx-thread-recovery-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1; tag commit verified 2026-10-11.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: JDK 17 and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "$SDK_PLATFORM" "$SDK_BUILD_TOOLS" > /dev/null
          ls "$ANDROID_HOME/platforms"
      - name: Compile Android test APKs before execution
        shell: bash
        working-directory: android-app
        run: bash gradlew --no-daemon --console=plain assembleDebugAndroidTest
      - name: JVM tests, debug APK assembly
        shell: bash
        working-directory: android-app
        run: |
          set -euo pipefail
          java -version
          bash gradlew --no-daemon --console=plain check
          if [ -f app/build.gradle.kts ]; then
            bash gradlew --no-daemon --console=plain :app:assembleDebug
          elif [ -f data/storage/build.gradle.kts ] || [ -f feature/settings/build.gradle.kts ]; then
            bash gradlew --no-daemon --console=plain assembleDebug
          else
            echo 'Core-only revision: no Android module to assemble.'
          fi
      - name: Count executed JVM tests
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = [p for p in pathlib.Path('android-app').glob('**/build/test-results/**/TEST-*.xml')]
          assert reports, 'No executed JVM test reports'
          total = failures = skipped = 0
          for p in reports:
              r = ET.parse(p).getroot()
              total += int(r.get('tests', 0))
              failures += sum(max(int(r.get(kind + 's', 0)), sum(case.find(kind) is not None for case in r.iter('testcase'))) for kind in ('failure', 'error'))
              skipped += max(int(r.get('skipped', 0)), sum(case.find('skipped') is not None for case in r.iter('testcase')))
          print('JVM test reports:', len(reports), 'tests:', total, 'failures+errors:', failures, 'skipped:', skipped)
          assert total - skipped > 0 and failures == 0 and skipped == 0
          PY
      - name: APK checksum and 16 KiB ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android-app/app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo 'No :app module yet; no APK built in this run.'; exit 0; fi
          for apk in "${apks[@]}"; do
            sha256sum "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -n 1
          done
      - name: Retain installable APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: command-library-fold7-apk-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain evidence
        if: always()
        # actions/upload-artifact v7.0.2; official release/tag commit observed 2026-10-11.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-k2-jvm-${{ github.sha }}
          path: |
            android-app/**/build/reports/tests/**
            android-app/**/build/test-results/**
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/data/storage/schemas/**/*.json
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    # Syntax/API failures stop here before provisioning the selected emulator configuration(s).
    needs: jvm-and-assemble
    if: github.repository == 'pemunson90-cmd/Command-Library'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Fold7-first: routine native checks use one modern configuration.
        # Older/alternate-page compatibility remains explicitly opt-in.
        include: ${{ fromJSON(inputs.compatibility_matrix == true && '[{"api":23,"image":"system-images;android-23;default;x86_64"},{"api":36,"image":"system-images;android-36;default;x86_64"},{"api":36,"image":"system-images;android-36;google_apis_ps16k;x86_64"}]' || '[{"api":36,"image":"system-images;android-36;default;x86_64"}]') }}
    steps:
      # actions/checkout v7.0.1; tag commit verified 2026-10-11.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require instrumentation sources for native acceptance
        id: gate
        shell: bash
        run: |
          if find android-app -path '*/src/androidTest/*' -name '*.kt' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Native acceptance requires instrumentation sources on this commit.'
            exit 1
          fi
      - name: Enable KVM
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: JDK 17, SDK packages, AVD
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "$SDK_PLATFORM" "$SDK_BUILD_TOOLS" emulator platform-tools "${{ matrix.image }}" > /dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/command-library-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n k2 -p "$ANDROID_AVD_HOME/k2.avd" -k "${{ matrix.image }}"
          test -f "$ANDROID_AVD_HOME/k2.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Boot emulator
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_AVD_HOME/k2.ini"
          trap 'tail -n 80 emulator.log' ERR
          nohup "$ANDROID_HOME/emulator/emulator" -avd k2 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -accel on > emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 120 "$ADB" wait-for-device
          timeout 900 bash -c "until [ \"\$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = '1' ]; do sleep 5; done"
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          echo "API: $($ADB shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ABI: $($ADB shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "Page size: $($ADB shell getconf PAGE_SIZE | tr -d '\r')"
      - name: Connected instrumentation tests
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: android-app
        # Retain the test APKs on this ephemeral AVD until synthetic captures are collected.
        # AGP9.4.1 otherwise requests uninstall, risking API23 external-files fallback loss.
        run: bash gradlew --no-daemon --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
      - name: Count executed instrumentation tests
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('android-app')
          # A module must report connected results when it has instrumentation sources, either
          # src/androidTest or a src/sharedTest directory its build adds to the androidTest source set.
          required = []
          for build in sorted(root.glob('**/build.gradle.kts')):
              module = build.parent
              if module == root or 'build' in module.relative_to(root).parts:
                  continue
              own = any((module / 'src/androidTest').rglob('*.kt'))
              shared = any((module / 'src/sharedTest').rglob('*.kt')) and 'getByName("androidTest")' in build.read_text()
              if own or shared:
                  required.append(module)
          assert required, 'No module has instrumentation sources'
          total = failures = skipped = 0
          for module in required:
              reports = list(module.glob('build/outputs/androidTest-results/connected/**/TEST-*.xml'))
              tests = fails = skips = 0
              for p in reports:
                  r = ET.parse(p).getroot()
                  tests += int(r.get('tests', 0))
                  fails += sum(max(int(r.get(kind + 's', 0)), sum(case.find(kind) is not None for case in r.iter('testcase'))) for kind in ('failure', 'error'))
                  skips += max(int(r.get('skipped', 0)), sum(case.find('skipped') is not None for case in r.iter('testcase')))
                  for case in r.iter('testcase'):
                      for kind in ('failure', 'error'):
                          issue = case.find(kind)
                          if issue is not None:
                              print('FAILED CASE:', case.get('classname'), case.get('name'))
                              print((issue.get('message', '') + '\n' + (issue.text or ''))[:4000])
              name = ':' + ':'.join(module.relative_to(root).parts)
              print(f'{name}: reports {len(reports)} tests {tests} failures+errors {fails} skipped {skips}')
              assert reports and tests - skips > 0 and skips == 0, f'{name} has instrumentation sources but no executed connected tests'
              total += tests
              failures += fails
              skipped += skips
          print('Instrumentation total tests:', total, 'failures+errors:', failures, 'skipped:', skipped)
          assert failures == 0 and skipped == 0
          PY
      - name: Collect synthetic visual captures
        if: always() && steps.gate.outputs.run == 'true'
        run: python3 scripts/collect_visual_captures.py --adb "$ANDROID_HOME/platform-tools/adb"
      - name: Retain evidence
        if: always() && steps.gate.outputs.run == 'true'
        # actions/upload-artifact v7.0.2; official release/tag commit observed 2026-10-11.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-k2-emulator-api${{ matrix.api }}-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            android-app/**/build/outputs/androidTest-results/**
            android-app/**/build/reports/androidTests/**
            visual-captures/**
            emulator.log
          if-no-files-found: ignore
          retention-days: 14

  verified-debug-apk:
    name: Selected-lane verified debug APK
    needs: [jvm-and-assemble, emulator]
    if: needs.jvm-and-assemble.result == 'success' && needs.emulator.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Download the exact-SHA APK built above, without rebuilding or trusting other refs.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: command-library-fold7-apk-${{ github.sha }}
          path: verified
      - name: Record APK and CI provenance
        env:
          SELECTED_NATIVE_LANES: ${{ inputs.compatibility_matrix == true && 'API23, API36, API36-16KiB' || 'API36' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find verified -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          {
            printf 'tested_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'verification=JVM/build plus %s emulator job(s) passed\n' "$SELECTED_NATIVE_LANES"
            printf '%s\n' 'scope=internal debug validation; not canonical release signing or physical Fold7 verification'
            sha256sum "${apks[0]}"
          } | tee verified/VERIFICATION.txt
      - name: Retain selected-native-verified internal debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: command-library-selected-native-verified-debug-${{ github.sha }}
          path: verified/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
